name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build with warnings as errors and run every test (unit + integration)
  # with both major compilers, on Linux and on macOS.
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++ }
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: macos-latest, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DDEPLOYGUARD_WERROR=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        working-directory: build
        run: ctest -L unit --output-on-failure -j 4

      - name: Integration tests
        working-directory: build
        run: ctest -L integration --output-on-failure -j 3

      - name: Demo
        run: scripts/demo.sh

      - name: Install
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/install"
          "$RUNNER_TEMP/install/bin/deploy-cli" --version

  # AddressSanitizer + UndefinedBehaviorSanitizer: memory errors, leaks and
  # undefined behaviour anywhere the tests reach.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDEPLOYGUARD_SANITIZE=ON -DDEPLOYGUARD_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: All tests
        working-directory: build
        run: ctest --output-on-failure -j 4

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh releases/*/app.sh tests/integration/*.sh

  # Line coverage of src/ by all tests, shown in the job summary.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pipx install gcovr
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
      - name: Build
        run: cmake --build build --parallel 4
      - name: Tests
        working-directory: build
        run: ctest --output-on-failure -j 4
      - name: Coverage report
        run: |
          gcovr -r . --filter 'src/' build | tee coverage.txt
          { echo '### Line coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
