name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DDEPLOYGUARD_WERROR=ON

      - name: Build
        run: cmake --build build -j 4

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure -j 4
